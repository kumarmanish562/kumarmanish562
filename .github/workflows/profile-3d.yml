name: GitHub Profile 3D Contrib - Manish Kumar

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Manish Kumar's 3D contribution profile

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: kumarmanish562
          MAX_REPOS: 100
          SETTING_JSON: profile-3d-contrib/settings.json

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: update Manish GitHub 3D contribution graph"
            git push
          fi
